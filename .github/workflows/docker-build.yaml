name: Build & Push Docker Images

on:
  push:
    branches:
      - master
      # - canary
  release:
    types: [published]

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant:
          - name: full
            dockerfile: Dockerfile
          - name: slim
            dockerfile: Dockerfile.slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release tag
        if: github.event_name == 'release'
        id: version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and push AMD64 Docker image (master)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          DOCKERFILE=${{ matrix.variant.dockerfile }}
          VARIANT=${{ matrix.variant.name }}
          docker buildx build --platform linux/amd64 \
            --cache-from=type=registry,ref=ghcr.io/s3tupw1zard/vane:${VARIANT}-amd64-cache \
            --cache-to=type=registry,ref=ghcr.io/s3tupw1zard/vane:${VARIANT}-amd64-cache,mode=max \
            --provenance false \
            -f $DOCKERFILE \
            -t s3tupw1zard/vane:${VARIANT}-amd64 \
            -t ghcr.io/s3tupw1zard/vane:${VARIANT}-amd64 \
            --push .

      - name: Build and push AMD64 Canary Docker image
        if: github.ref == 'refs/heads/canary' && github.event_name == 'push'
        run: |
          DOCKERFILE=${{ matrix.variant.dockerfile }}
          VARIANT=${{ matrix.variant.name }}
          docker buildx build --platform linux/amd64 \
            --cache-from=type=registry,ref=ghcr.io/s3tupw1zard/vane:${VARIANT}-canary-amd64-cache \
            --cache-to=type=registry,ref=ghcr.io/s3tupw1zard/vane:${VARIANT}-canary-amd64-cache,mode=max \
            --provenance false \
            -f $DOCKERFILE \
            -t s3tupw1zard/vane:${VARIANT}-canary-amd64 \
            -t ghcr.io/s3tupw1zard/vane:${VARIANT}-canary-amd64 \
            --push .

      - name: Build and push AMD64 release Docker image
        if: github.event_name == 'release' && github.event.release.prerelease == false
        run: |
          DOCKERFILE=${{ matrix.variant.dockerfile }}
          VARIANT=${{ matrix.variant.name }}
          docker buildx build --platform linux/amd64 \
            --cache-from=type=registry,ref=ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-amd64-cache \
            --cache-to=type=registry,ref=ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-amd64-cache,mode=max \
            --provenance false \
            -f $DOCKERFILE \
            -t s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-amd64 \
            -t ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-amd64 \
            --push .

      - name: Build and push AMD64 pre-release Docker image
        if: github.event_name == 'release' && github.event.release.prerelease == true
        run: |
          DOCKERFILE=${{ matrix.variant.dockerfile }}
          VARIANT=${{ matrix.variant.name }}
          docker buildx build --platform linux/amd64 \
            --cache-from=type=registry,ref=ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre-amd64-cache \
            --cache-to=type=registry,ref=ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre-amd64-cache,mode=max \
            --provenance false \
            -f $DOCKERFILE \
            -t s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre-amd64 \
            -t ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre-amd64 \
            --push .

  build-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        variant:
          - name: full
            dockerfile: Dockerfile
          - name: slim
            dockerfile: Dockerfile.slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release tag
        if: github.event_name == 'release'
        id: version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build and push ARM64 Docker image (master)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          DOCKERFILE=${{ matrix.variant.dockerfile }}
          VARIANT=${{ matrix.variant.name }}
          docker buildx build --platform linux/arm64 \
            --cache-from=type=registry,ref=ghcr.io/s3tupw1zard/vane:${VARIANT}-arm64-cache \
            --cache-to=type=registry,ref=ghcr.io/s3tupw1zard/vane:${VARIANT}-arm64-cache,mode=max \
            --provenance false \
            -f $DOCKERFILE \
            -t s3tupw1zard/vane:${VARIANT}-arm64 \
            -t ghcr.io/s3tupw1zard/vane:${VARIANT}-arm64 \
            --push .

      - name: Build and push ARM64 Canary Docker image
        if: github.ref == 'refs/heads/canary' && github.event_name == 'push'
        run: |
          DOCKERFILE=${{ matrix.variant.dockerfile }}
          VARIANT=${{ matrix.variant.name }}
          docker buildx build --platform linux/arm64 \
            --cache-from=type=registry,ref=ghcr.io/s3tupw1zard/vane:${VARIANT}-canary-arm64-cache \
            --cache-to=type=registry,ref=ghcr.io/s3tupw1zard/vane:${VARIANT}-canary-arm64-cache,mode=max \
            --provenance false \
            -f $DOCKERFILE \
            -t s3tupw1zard/vane:${VARIANT}-canary-arm64 \
            -t ghcr.io/s3tupw1zard/vane:${VARIANT}-canary-arm64 \
            --push .

      - name: Build and push ARM64 release Docker image
        if: github.event_name == 'release' && github.event.release.prerelease == false
        run: |
          DOCKERFILE=${{ matrix.variant.dockerfile }}
          VARIANT=${{ matrix.variant.name }}
          docker buildx build --platform linux/arm64 \
            --cache-from=type=registry,ref=ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-arm64-cache \
            --cache-to=type=registry,ref=ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-arm64-cache,mode=max \
            --provenance false \
            -f $DOCKERFILE \
            -t s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-arm64 \
            -t ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-arm64 \
            --push .

      - name: Build and push ARM64 pre-release Docker image
        if: github.event_name == 'release' && github.event.release.prerelease == true
        run: |
          DOCKERFILE=${{ matrix.variant.dockerfile }}
          VARIANT=${{ matrix.variant.name }}
          docker buildx build --platform linux/arm64 \
            --cache-from=type=registry,ref=ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre-arm64-cache \
            --cache-to=type=registry,ref=ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre-arm64-cache,mode=max \
            --provenance false \
            -f $DOCKERFILE \
            -t s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre-arm64 \
            -t ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre-arm64 \
            --push .

  manifest:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [full, slim]
    steps:
      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release tag
        if: github.event_name == 'release'
        id: version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Create and push manifest for main
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          VARIANT=${{ matrix.variant }}

          docker manifest create s3tupw1zard/vane:${VARIANT}-latest \
            --amend s3tupw1zard/vane:${VARIANT}-amd64 \
            --amend s3tupw1zard/vane:${VARIANT}-arm64
          docker manifest push s3tupw1zard/vane:${VARIANT}-latest

          docker manifest create ghcr.io/s3tupw1zard/vane:${VARIANT}-latest \
            --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-amd64 \
            --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-arm64
          docker manifest push ghcr.io/s3tupw1zard/vane:${VARIANT}-latest

          if [ "$VARIANT" = "full" ]; then
            docker manifest create s3tupw1zard/vane:latest \
              --amend s3tupw1zard/vane:${VARIANT}-amd64 \
              --amend s3tupw1zard/vane:${VARIANT}-arm64
            docker manifest push s3tupw1zard/vane:latest

            docker manifest create ghcr.io/s3tupw1zard/vane:latest \
              --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-amd64 \
              --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-arm64
            docker manifest push ghcr.io/s3tupw1zard/vane:latest

            docker manifest create s3tupw1zard/vane:main \
              --amend s3tupw1zard/vane:${VARIANT}-amd64 \
              --amend s3tupw1zard/vane:${VARIANT}-arm64
            docker manifest push s3tupw1zard/vane:main

            docker manifest create ghcr.io/s3tupw1zard/vane:main \
              --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-amd64 \
              --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-arm64
            docker manifest push ghcr.io/s3tupw1zard/vane:main
          fi

      - name: Create and push manifest for canary
        if: github.ref == 'refs/heads/canary' && github.event_name == 'push'
        run: |
          VARIANT=${{ matrix.variant }}

          docker manifest create s3tupw1zard/vane:${VARIANT}-canary \
            --amend s3tupw1zard/vane:${VARIANT}-canary-amd64 \
            --amend s3tupw1zard/vane:${VARIANT}-canary-arm64
          docker manifest push s3tupw1zard/vane:${VARIANT}-canary

          docker manifest create ghcr.io/s3tupw1zard/vane:${VARIANT}-canary \
            --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-canary-amd64 \
            --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-canary-arm64
          docker manifest push ghcr.io/s3tupw1zard/vane:${VARIANT}-canary

          if [ "$VARIANT" = "full" ]; then
            docker manifest create s3tupw1zard/vane:canary \
              --amend s3tupw1zard/vane:${VARIANT}-canary-amd64 \
              --amend s3tupw1zard/vane:${VARIANT}-canary-arm64
            docker manifest push s3tupw1zard/vane:canary

            docker manifest create ghcr.io/s3tupw1zard/vane:canary \
              --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-canary-amd64 \
              --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-canary-arm64
            docker manifest push ghcr.io/s3tupw1zard/vane:canary
          fi

      - name: Create and push manifest for releases
        if: github.event_name == 'release' && github.event.release.prerelease == false
        run: |
          VARIANT=${{ matrix.variant }}

          docker manifest create s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }} \
            --amend s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-amd64 \
            --amend s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-arm64
          docker manifest push s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}

          docker manifest create ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }} \
            --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-amd64 \
            --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-arm64
          docker manifest push ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}

          if [ "$VARIANT" = "full" ]; then
            docker manifest create s3tupw1zard/vane:${{ env.RELEASE_VERSION }} \
              --amend s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-amd64 \
              --amend s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-arm64
            docker manifest push s3tupw1zard/vane:${{ env.RELEASE_VERSION }}

            docker manifest create ghcr.io/s3tupw1zard/vane:${{ env.RELEASE_VERSION }} \
              --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-amd64 \
              --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-arm64
            docker manifest push ghcr.io/s3tupw1zard/vane:${{ env.RELEASE_VERSION }}
          fi

      - name: Create and push manifest for pre-releases
        if: github.event_name == 'release' && github.event.release.prerelease == true
        run: |
          VARIANT=${{ matrix.variant }}

          docker manifest create s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre \
            --amend s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre-amd64 \
            --amend s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre-arm64
          docker manifest push s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre

          docker manifest create ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre \
            --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre-amd64 \
            --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre-arm64
          docker manifest push ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre

          if [ "$VARIANT" = "full" ]; then
            docker manifest create s3tupw1zard/vane:${{ env.RELEASE_VERSION }}-pre \
              --amend s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre-amd64 \
              --amend s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre-arm64
            docker manifest push s3tupw1zard/vane:${{ env.RELEASE_VERSION }}-pre

            docker manifest create ghcr.io/s3tupw1zard/vane:${{ env.RELEASE_VERSION }}-pre \
              --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre-amd64 \
              --amend ghcr.io/s3tupw1zard/vane:${VARIANT}-${{ env.RELEASE_VERSION }}-pre-arm64
            docker manifest push ghcr.io/s3tupw1zard/vane:${{ env.RELEASE_VERSION }}-pre
          fi
